<header class="app-header">
  <div class="header-bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor"
                d="M12 2c1.5 0 2.4 1.2 2.4 2.7 0 1-.4 1.7-.7 2.4-.2.4-.2.8 0 1.2.9 1.6 2.6 3.6 2.6 7 0 3.3-1.6 5.7-2.6 6.4-.5.2-1 .3-1.7.3s-1.2-.1-1.7-.3c-1-.7-2.6-3.1-2.6-6.4 0-3.4 1.7-5.4 2.6-7 .2-.4.2-.8 0-1.2-.3-.7-.7-1.4-.7-2.4C9.6 3.2 10.5 2 12 2zm-2.2 7.6h4.4v1.1H9.8z"/>
        </svg>
      </span>
      <span class="brand-name">Bowling Turni</span>
    </div>

    <nav class="nav-links" *ngIf="links.length">
      <a *ngFor="let link of links" [routerLink]="link.route" routerLinkActive="active">
        <mat-icon>{{ link.icona }}</mat-icon>
        <span>{{ link.label }}</span>
      </a>
    </nav>

    <button class="user-button" [matMenuTriggerFor]="menuUtente" aria-label="Menu utente">
      <span class="user-name">{{ nomeUtente }}</span>
      <span class="avatar">{{ getIniziali() }}</span>
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <mat-menu #menuUtente="matMenu" xPosition="before">
      <button mat-menu-item *ngFor="let voce of vociMenu" (click)="voceSelezionata.emit(voce.id)">
        <mat-icon>{{ voce.icona }}</mat-icon>
        <span>{{ voce.label }}</span>
      </button>
    </mat-menu>
  </div>

  <div class="header-content">
    <ng-content></ng-content>
  </div>
</header>

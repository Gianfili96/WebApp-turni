<div class="dialog-container">

  <div class="dialog-header">
    <mat-icon class="dialog-icon">warning_amber</mat-icon>
    <h2>Conferma eliminazione</h2>
  </div>

  <mat-dialog-content>
    <p>{{ data.messaggio }}</p>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-stroked-button (click)="annulla()">
      Annulla
    </button>
    <button mat-raised-button color="warn" (click)="conferma()">
      <mat-icon>delete</mat-icon> Elimina
    </button>
  </mat-dialog-actions>

</div>

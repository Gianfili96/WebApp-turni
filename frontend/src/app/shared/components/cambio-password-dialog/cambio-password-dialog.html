<div class="dialog-container">

  <div class="dialog-header">
    <mat-icon class="dialog-icon">lock</mat-icon>
    <h2>Cambia Password</h2>
    <button mat-icon-button (click)="annulla()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <p class="dialog-subtitle">Inserisci la password attuale e scegli una nuova password sicura.</p>

    <form [formGroup]="form">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password attuale</mat-label>
        <input matInput [type]="hidePasswordAttuale ? 'password' : 'text'" formControlName="passwordAttuale">
        <button mat-icon-button matSuffix type="button" (click)="hidePasswordAttuale = !hidePasswordAttuale">
          <mat-icon>{{ hidePasswordAttuale ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>Obbligatoria</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nuova password</mat-label>
        <input matInput [type]="hideNuovaPassword ? 'password' : 'text'" formControlName="nuovaPassword">
        <button mat-icon-button matSuffix type="button" (click)="hideNuovaPassword = !hideNuovaPassword">
          <mat-icon>{{ hideNuovaPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('nuovaPassword')?.hasError('required')">Obbligatoria</mat-error>
        <mat-error *ngIf="form.get('nuovaPassword')?.hasError('minlength')">Minimo 6 caratteri</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Conferma nuova password</mat-label>
        <input matInput [type]="hideConfermaPassword ? 'password' : 'text'" formControlName="confermaPassword">
        <button mat-icon-button matSuffix type="button" (click)="hideConfermaPassword = !hideConfermaPassword">
          <mat-icon>{{ hideConfermaPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('confermaPassword')?.hasError('required')">Obbligatoria</mat-error>
        <mat-error *ngIf="form.hasError('passwordMismatch') && form.get('confermaPassword')?.touched">
          Le password non coincidono
        </mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-stroked-button (click)="annulla()" [disabled]="loading">
      Annulla
    </button>
    <button mat-raised-button color="primary" (click)="onSubmit()"
            [disabled]="form.invalid || loading">
      <span *ngIf="!loading">Cambia Password</span>
      <span *ngIf="loading">Salvataggio...</span>
    </button>
  </mat-dialog-actions>

</div>
